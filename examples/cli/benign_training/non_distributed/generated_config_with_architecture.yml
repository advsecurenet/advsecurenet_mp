model:
  model_name: resnet18
  architecture:
    num_input_channels: 3
    num_classes: 10
  pretrained: true
  weights: IMAGENET1K_V1
  is_external: false
  random_seed: null
  path_configs:
    model_arch_path: null
    model_weights_path: null
  norm_config:
    add_norm_layer: false
    norm_mean:
      - 0.5
      - 0.5
      - 0.5
    norm_std:
      - 0.5
      - 0.5
      - 0.5
dataset:
  dataset_name: cifar10
  num_classes: 10
  train_dataset_path: null
  test_dataset_path: null
  preprocessing:
    steps:
      - name: ToImage
        params: null
      - name: ToDtype
        params:
          dtype: torch.float32
          scale: true
dataloader:
  train:
    num_workers: 4
    shuffle: true
    drop_last: false
    pin_memory: true
    batch_size: 32
  test:
    num_workers: 4
    shuffle: true
    drop_last: false
    pin_memory: true
    batch_size: 32
device:
  use_ddp: true
  processor: cuda
  gpu_ids:
    - 1
training:
  epochs: 10
  learning_rate: 0.001
  optimizer: adam
  optimizer_kwargs:
    weight_decay: 0.0001
  scheduler: LINEAR_LR
  scheduler_kwargs: null
  criterion: cross_entropy
  save_final_model: true
  save_model_path: null
  save_model_name: null
  save_checkpoint: false
  save_checkpoint_path: null
  save_checkpoint_name: null
  checkpoint_interval: 1
  load_checkpoint: false
  load_checkpoint_path: null
  verbose: true
