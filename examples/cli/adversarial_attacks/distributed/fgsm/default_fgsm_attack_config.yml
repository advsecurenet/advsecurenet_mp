model:
  model_name: resnet18
  architecture:
    num_input_channels: 3
    num_classes: 10
  pretrained: true
  weights: IMAGENET1K_V1
  is_external: false
  random_seed: null
  path_configs:
    model_arch_path: null
    model_weights_path: null
  norm_config:
    add_norm_layer: false
    norm_mean:
      - 0.5
      - 0.5
      - 0.5
    norm_std:
      - 0.5
      - 0.5
      - 0.5
dataset:
  dataset_name: cifar10
  num_classes: 10
  load_splits:
    - test
  train_dataset_path: null
  test_dataset_path: null
  random_sample_size: null
  preprocessing:
    steps:
      - name: ToImage
        params: null
      - name: ToDtype
        params:
          dtype: torch.float32
          scale: true
dataloader:
  default:
    num_workers: 4
    shuffle: true
    drop_last: false
    pin_memory: true
    batch_size: 32
device:
  use_ddp: false
  processor: cuda
  gpu_ids: null
attack_procedure:
  verbose: true
  save_result_images: true
  result_images_dir: attack
  result_images_prefix: adv
attack_config:
  target_parameters:
    targeted: false
    auto_generate_target: true
    target_images_config:
      target_images_dir: null
    target_labels_config:
      target_labels: []
      target_labels_path: null
      target_labels_separator: ','
  attack_parameters:
    epsilon: 0.3
