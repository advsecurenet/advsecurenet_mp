model:
  model_name: microsoft/resnet-18
  pretrained: true
  trust_remote_code: false
  architecture:
    num_classes: 10
  is_external: false
  random_seed:
  path_configs:
    model_arch_path:
    model_weights_path:
  norm_config:
    add_norm_layer: false
    norm_mean:
    - 0.5
    - 0.5
    - 0.5
    norm_std:
    - 0.5
    - 0.5
    - 0.5
dataset:
  dataset_name: huggingface
  identifier: uoft-cs/cifar10
  num_classes: 10
  split_config:
    train:
      identifier: uoft-cs/cifar10
      split_name: train
      constructor_args:
        input_key: img
        target_key: label
    test:
      identifier: uoft-cs/cifar10
      split_name: test
      constructor_args:
        input_key: img
        target_key: label
  train_dataset_path:
  test_dataset_path:
  preprocessing:
    steps:
    - name: ToImage
      params:
    - name: ToDtype
      params:
        dtype: torch.float32
        scale: true
dataloader:
  train:
    num_workers: 4
    shuffle: true
    drop_last: false
    pin_memory: true
    batch_size: 32
  test:
    num_workers: 4
    shuffle: true
    drop_last: false
    pin_memory: true
    batch_size: 32
device:
  use_ddp: false
  processor: mps
  gpu_ids:
training:
  epochs: 10
  learning_rate: 0.001
  optimizer: adam
  optimizer_kwargs:
    weight_decay: 0.0001
  scheduler: LINEAR_LR
  scheduler_kwargs:
  criterion: cross_entropy
  save_final_model: true
  save_model_path:
  save_model_name:
  save_checkpoint: false
  save_checkpoint_path:
  save_checkpoint_name:
  checkpoint_interval: 1
  load_checkpoint: false
  load_checkpoint_path:
  verbose: true
