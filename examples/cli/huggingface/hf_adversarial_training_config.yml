# Hugging Face Adversarial Training Configuration
# This configuration demonstrates adversarial training with Hugging Face components

# Dataset Configuration with Advanced Split Management
# IMPORTANT: All datasets must have same input dimensions and output classes!
# Example: CIFAR-10 (32x32, 10 classes) can only work with other 32x32, 10-class datasets
dataset:
  dataset_name: "huggingface"
  identifier: "uoft-cs/cifar10"  # Default dataset identifier
  num_classes: 10
  
  # Use split_config for different train/test datasets
  split_config:
    train:
      identifier: "uoft-cs/cifar10"
      split_name: "train"
    test:
      identifier: "uoft-cs/cifar10"  # Same dataset for compatibility
      split_name: "test"
  
  # This load_splits will be IGNORED because split_config has higher priority
  load_splits:
    - "train"
    - "test"
  
  # Global preprocessing (applied to all splits unless overridden)
  preprocessing:
    resize: [32, 32]
    normalize_means: [0.485, 0.456, 0.406]
    normalize_stds: [0.229, 0.224, 0.225]
  
  # Hugging Face specific parameters
  constructor_args:
    input_key: "img"      # Key for image data in HF dataset
    target_key: "label"   # Key for labels in HF dataset

# Model Configuration
model:
  model_name: "huggingface"
  model_identifier: "microsoft/resnet-18"  # Use model_identifier for HF model ID
  pretrained: true  # Direct attribute
  trust_remote_code: false  # Direct attribute  
  architecture:
    num_classes: 10

# Training Configuration
training:
  epochs: 5
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"
  scheduler: "step"
  scheduler_kwargs:
    step_size: 2
    gamma: 0.1
  device: "auto"
  
  # Adversarial Training Specific Parameters
  adversarial_ratio: 0.5  # 50% of training data will be adversarial
  
  # Attack configuration for generating adversarial examples during training
  attack_config:
    attack_name: "fgsm"
    epsilon: 0.03
    targeted: false
  
  # Training optimization
  gradient_clipping: 1.0
  early_stopping:
    patience: 3
    min_delta: 0.001

# Checkpoint and Logging Configuration
save_checkpoint: true
checkpoint_interval: 1
checkpoint_dir: "./checkpoints"
log_interval: 100

# Evaluation Configuration
evaluate_during_training: true
evaluation_interval: 1

# Output Configuration
save_best_model: true
save_final_model: true
model_save_dir: "./models"

# Advanced Options
mixed_precision: false  # Set to true for faster training on supported hardware
num_workers: 4  # Data loading workers
