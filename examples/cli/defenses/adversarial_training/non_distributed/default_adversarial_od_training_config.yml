task: detection
training:
  model:
    model_name: CustomYolov5Model
    num_input_channels: 3
    architecture:
      num_classes: 80
    pretrained: false
    weights: DEFAULT
    is_external: true
    random_seed:
    path_configs:
      model_weights_path: model_weights/yolov5s.pt
      model_arch_path: 
        ../../../advsecurenet/models/CustomODModels/CustomYolov5Model.py
    norm_config:
      add_norm_layer: false
      norm_mean:
      - 0.485
      - 0.456
      - 0.406
      norm_std:
      - 0.229
      - 0.224
      - 0.225
    object_detector_config:
      conf_thresh: 0.25
      input_shape:
      - 3
      - 640
      - 640
      clip_values:
      - 0
      - 255
      attack_losses:
      - loss_total
      - loss_cls
      - loss_box
      - loss_obj
  dataset:
    dataset_name: coco
    download: true
    num_classes: 80
    split: train
    path: advsecurenet/data
    random_sample_size: 10
    preprocessing:
      steps:
      - name: Resize
        params:
          size:
          - 640
          - 640
      - name: ToTensor
        params: {}
      - name: ToDtype
        params:
          dtype: torch.float32
  dataloader:
    train:
      num_workers: 4
      shuffle: true
      drop_last: false
      pin_memory: true
      batch_size: 5
    test:
      num_workers: 4
      shuffle: true
      drop_last: false
      pin_memory: true
      batch_size: 5
  device:
    use_ddp: false
    processor: cuda:0
    gpu_ids:
  training:
    training_hyperparameter:
      epochs: 1
      learning_rate: 0.001
      criterion: cross_entropy
      verbose: false
    optimization:
      optimizer: adam
      optimizer_kwargs:
        weight_decay: 0.0001
      scheduler: LINEAR_LR
      scheduler_kwargs:
      criterion: cross_entropy
    final_model:
      save_final_model: true
      save_model_path:
      save_model_name:
    checkpoint:
      save_checkpoint: false
      save_checkpoint_path:
      save_checkpoint_name:
      checkpoint_interval: 1
      load_checkpoint: false
      load_checkpoint_path:
adversarial_training:
  models: []
  attacks:
  - tog: ../attacks/tog_attack_config.yml
