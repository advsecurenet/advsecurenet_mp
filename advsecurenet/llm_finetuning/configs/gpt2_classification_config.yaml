# Configuration for fine-tuning GPT-2 on a classification task

model_config:
  model_name: "gpt2"
  model_type: "classification"
  num_labels: 4  # Number of labels in the classification task

training_config:
  output_dir: "./results/gpt2_classification"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 5e-5
  weight_decay: 0.01
  warmup_steps: 100
  logging_steps: 50
  eval_steps: 100
  save_steps: 200
  evaluation_strategy: "steps"
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "accuracy"
  greater_is_better: true
  save_total_limit: 2
  logging_dir: "./logs/gpt2_classification"
  dataloader_num_workers: 4
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0

data_config:
  dataset_name: "ag_news"  # HuggingFace dataset name
  text_column: "text"
  label_column: "label"
  validation_split: 0.2
  max_length: 128
  preprocessing_num_workers: 4
