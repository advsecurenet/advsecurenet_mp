train:
  model_name: gpt2
  output_dir: outputs/gpt2-wikitext
  learning_rate: 5e-4
  max_steps: 1000
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  fp16: true
  bf16: false
  gradient_checkpointing: true
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 100
data:
  hub_name: wikitext
  hub_config: wikitext-2-raw-v1
  hub_train_split: "train"
  hub_eval_split: "validation"
  max_seq_len: 256   # 256–512 OK; shorter = less OOM risk
peft:
  enabled: false
  quantization: null
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj","k_proj","v_proj","o_proj"]